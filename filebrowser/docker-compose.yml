services:
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    ports:
      - "8082:80"
    volumes:
      - /home/lukas:/srv/home
      - /:/srv/root:ro
      - /mnt/hd2tb:/srv/hd2tb
      - ./filebrowser/database.db:/database/filebrowser.db
      - ./filebrowser/config:/config
