services:
  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000
    ports:
       - "4533:4533"
    restart: unless-stopped
    #environment:
      # ND_LOGLEVEL: debug
    volumes:
     - "/mnt/hd2tb/media-server/navidrome/data:/data"
     - "/mnt/hd2tb/media-server/musicas:/music:ro"
